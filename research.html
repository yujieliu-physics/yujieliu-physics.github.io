<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yu-Jie Liu – Research</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<aside class="sidebar">
  <img class="profile-photo" src="profile.jpg" alt="Yu-Jie Liu">

  <div class="sidebar-name">Yu-Jie Liu</div>
  <p class="sidebar-subtitle">
    Postdoctoral Associate<br>
    MIT Center for Theoretical Physics
  </p>

  <form class="site-search" onsubmit="return false;">
    <input id="site-search-input" type="search" placeholder="Search" aria-label="Search this site">
  </form>

  <ul class="sidebar-nav">
    <li><a href="index.html" class="">About</a></li>
    <li><a href="research.html" class="active">Research</a></li>
    <li><a href="publications.html" class="">Publications</a></li>
  </ul>

  <div class="sidebar-links">
    <a href="mailto:yujieliu@mit.edu">Email</a>
  </div>
</aside>

<div class="main">
  <main class="content">
    <h1>Research</h1>

    <p>
      Under development.
    </p>
  </main>
</div>

<script>
const input = document.getElementById('site-search-input');
if (input) {
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const q = input.value.trim().toLowerCase();
      if (!q) return;
      if (q.includes('research')) window.location.href = 'research.html';
      else if (q.includes('publication') || q.includes('paper')) window.location.href = 'publications.html';
      else if (q.includes('about') || q.includes('bio') || q.includes('contact')) window.location.href = 'index.html';
      else {
        const el = Array.from(document.querySelectorAll('main *')).find(
          x => x.children.length === 0 && x.textContent.toLowerCase().includes(q)
        );
        if (el) {
          el.scrollIntoView({behavior:'smooth', block:'center'});
        }
      }
    }
  });
}
</script>
</body></html>
